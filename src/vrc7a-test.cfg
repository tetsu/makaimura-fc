MEMORY {
    ZP:      start = $0000, size = $0100, type = rw, file = "";
    RAM:     start = $0200, size = $0600, type = rw, file = "";
    HEADER:  start = $0000, size = $0010, type = ro, fill = yes;
    PRG0:    start = $8000, size = $2000, type = ro, fill = yes;
    PRG1:    start = $A000, size = $2000, type = ro, fill = yes;
    PRG2:    start = $C000, size = $2000, type = ro, fill = yes;
    FIXED:   start = $E000, size = $1FFA, type = ro, fill = yes;
    VECTORS: start = $FFFA, size = $0006, type = ro, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    BSS:      load = RAM, type = bss;
    HEADER:   load = HEADER, type = ro;
    BANK0:    load = PRG0, type = ro;
    BANK1:    load = PRG1, type = ro;
    BANK2:    load = PRG2, type = ro;
    CODE:     load = FIXED, type = ro;
    RODATA:   load = FIXED, type = ro;
    VECTORS:  load = VECTORS, type = ro;
}
